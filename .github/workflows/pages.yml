name: Deploy MynAssistant Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          node --check service-worker.js

      - name: Validate PWA manifest
        run: python -m json.tool manifest.webmanifest > /dev/null

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          node --check service-worker.js

      - name: Validate PWA manifest
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Generate Android and browser PNG icons from the exact MynAssistant logo
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("mynassistant-logo.webp")
          if not source.is_file():
              raise SystemExit("The owner-provided MynAssistant logo is missing.")

          with Image.open(source) as opened:
              if opened.format != "WEBP" or opened.size != (256, 256):
                  raise SystemExit("The canonical MynAssistant logo has an unexpected format or dimensions.")
              image = opened.convert("RGBA")
              for size, filename in (
                  (192, "mynassistant-icon-192.png"),
                  (512, "mynassistant-icon-512.png"),
              ):
                  image.resize((size, size), Image.Resampling.LANCZOS).save(
                      filename, format="PNG", optimize=True
                  )
                  with Image.open(filename) as check:
                      if check.format != "PNG" or check.size != (size, size):
                          raise SystemExit(f"Invalid browser icon generated: {filename}")
                  print(f"Generated {filename}")
          PY

      - name: Verify web entry points
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s firebase-config.js
          test -s mynassistant-logo.webp
          test -s mynassistant-icon-192.png
          test -s mynassistant-icon-512.png
          test -s assets/mynassistant-ribbons-layer.webp
          test -s assets/mynassistant-ribbon-1.webp
          test -s assets/mynassistant-ribbon-2.webp
          test -s assets/mynassistant-ribbon-3.webp
          test -s assets/mynassistant-center-medallion.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for name in (
              "mynassistant-ribbon-1.webp",
              "mynassistant-ribbon-2.webp",
              "mynassistant-ribbon-3.webp",
          ):
              path = Path("assets") / name
              with Image.open(path) as image:
                  if image.format != "WEBP" or image.size != (128, 128) or image.mode != "RGBA":
                      raise SystemExit(f"Invalid separated ribbon image: {name}")
                  alpha = image.getchannel("A")
                  if alpha.getextrema()[0] != 0 or alpha.getextrema()[1] == 0:
                      raise SystemExit(f"Ribbon must retain transparent background: {name}")
              print(f"Validated independent transparent layer: {name}")
          PY
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          path = Path("assets/mynassistant-center-medallion.webp")
          with Image.open(path) as image:
              if image.format != "WEBP" or image.size != (256, 256) or image.mode != "RGBA":
                  raise SystemExit("Independent MynAssistant center medallion has invalid format, size, or alpha mode.")
              alpha = image.getchannel("A")
              if alpha.getextrema()[0] != 0 or alpha.getextrema()[1] == 0:
                  raise SystemExit("Center medallion must have transparent background and visible pixels.")
          print("Validated transparent independent MynAssistant center medallion.")
          PY
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          path = Path("assets/mynassistant-ribbons-layer.webp")
          with Image.open(path) as image:
              if image.format != "WEBP" or image.size != (192, 192) or image.mode != "RGBA":
                  raise SystemExit("Independent MynAssistant ribbon layer has invalid format, size, or alpha mode.")
              alpha = image.getchannel("A")
              if alpha.getextrema()[0] != 0 or alpha.getextrema()[1] == 0:
                  raise SystemExit("Independent ribbon layer must have a transparent background and visible pixels.")
          print("Validated transparent independent MynAssistant ribbon layer.")
          PY
          grep -q 'home-logo-ribbon--one' app.js
          grep -q 'home-logo-ribbon--two' app.js
          grep -q 'home-logo-ribbon--three' app.js
          grep -q 'mynassistant-center-medallion.webp' app.js
          grep -q 'myn-ribbon-one-orbit' styles.css
          grep -q 'myn-ribbon-two-orbit' styles.css
          grep -q 'myn-ribbon-three-orbit' styles.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
