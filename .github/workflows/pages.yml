name: Deploy MynAssistant Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          node --check service-worker.js

      - name: Validate PWA manifest
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Generate Android and browser PNG icons from the exact MynAssistant logo
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("mynassistant-logo.webp")
          if not source.is_file():
              raise SystemExit("The owner-provided MynAssistant logo is missing.")

          with Image.open(source) as opened:
              if opened.format != "WEBP" or opened.size != (256, 256):
                  raise SystemExit("The canonical MynAssistant logo has an unexpected format or dimensions.")
              image = opened.convert("RGBA")
              for size, filename in (
                  (192, "mynassistant-icon-192.png"),
                  (512, "mynassistant-icon-512.png"),
              ):
                  image.resize((size, size), Image.Resampling.LANCZOS).save(
                      filename, format="PNG", optimize=True
                  )
                  with Image.open(filename) as check:
                      if check.format != "PNG" or check.size != (size, size):
                          raise SystemExit(f"Invalid browser icon generated: {filename}")
                  print(f"Generated {filename}")
          PY

      - name: Verify web entry points
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s firebase-config.js
          test -s mynassistant-logo.webp
          test -s mynassistant-icon-192.png
          test -s mynassistant-icon-512.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
